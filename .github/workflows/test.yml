# The Panopticon Protocol — CI/CD Pipeline
# Green Agent + Purple Agent
#
# Runs on: push and pull_request to main branch
# Actions: lint, type-check, test with coverage, Docker build

name: Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting with ruff
        run: |
          pip install ruff
          ruff check src/ tests/ --ignore E501
        continue-on-error: true
      
      - name: Run type checking with mypy
        run: |
          pip install mypy types-requests mypy-protobuf
          mypy src/ --ignore-missing-imports --no-error-summary --exclude '.*_pb2\.py$'
        continue-on-error: true
      
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=65 \
            -v
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  # ════════════════════════════════════════════════════════════════
  # PURPLE AGENT — Investigator Tests
  # ════════════════════════════════════════════════════════════════
  test-purple:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    defaults:
      run:
        working-directory: tracer_agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: tracer_agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run linting with ruff
        run: |
          pip install ruff
          ruff check src/ tests/ --ignore E501
        continue-on-error: true

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Hide repo-root src/ (Forge agent) to prevent import collision.
          # tracer_agent tests do `from tracer_agent.src.core.xxx import ...` —
          # PYTHONPATH points to repo root so the tracer_agent package is found.
          mv ../src ../src_forge_hidden
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=0 \
            -v
          EXIT_CODE=$?
          mv ../src_forge_hidden ../src
          exit $EXIT_CODE
  # ════════════════════════════════════════════════════════════════
  # DOCKER BUILD — Both Agents
  # ════════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    needs: [test, test-purple]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true  # Load image to local Docker daemon for testing
          tags: green-financial-crime-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Green Agent image
        run: |
          docker run --rm green-financial-crime-agent:test python -c "from src.core import graph_generator, crime_injector, a2a_interface; print('Green Agent imports OK')"

      - name: Build Tracer Agent Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./tracer_agent
          push: false
          load: true
          tags: tracer-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Tracer Agent image
        run: |
          docker run --rm --entrypoint python tracer-agent:test -c "from tracer_agent.src.core import graph_reasoner, a2a_client, sar_drafter; print('Tracer Agent imports OK')"
