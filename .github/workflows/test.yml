# ARGUS CI Pipeline — Falsifiable Verification Without Suppressed Failures
# Covers: Forge regression, Tracer regression, Production Backend + PostgreSQL 16
# (migrations, RLS, concurrency, worker, offline verifier), Frontend lint/test/build,
# Production Docker image smoke test, and dependency/secret/SBOM checks.
# No remote publishing occurs in this workflow.

name: ARGUS Verification Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test-forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Forge dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov ruff
      - name: Lint Forge
        run: ruff check src/ tests/ --select E,F --ignore E501,E402
      - name: Run Forge tests with coverage
        env:
          PYTHONHASHSEED: '0'
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=65 -v

  test-tracer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tracer_agent/requirements.txt
      - name: Install Tracer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tracer_agent/requirements.txt pytest pytest-asyncio pytest-cov hypothesis ruff
      - name: Lint Tracer
        run: ruff check tracer_agent/src/ tracer_agent/tests/ --select E,F --ignore E501,E402
      - name: Run Tracer tests (no source hiding)
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tracer_agent/tests/ -v

  test-production-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argus_admin
          POSTGRES_PASSWORD: argus_test_password
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: argus-app/backend/requirements-research.txt
      - name: Install Production + Test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r argus-app/backend/requirements-research.txt pytest pytest-asyncio ruff
      - name: Lint Production Backend
        run: |
          ruff check --select E,F --ignore E501,E402 \
            argus-app/backend/auth.py \
            argus-app/backend/database.py \
            argus-app/backend/production.py \
            argus-app/backend/settings.py \
            argus-app/backend/verifier.py \
            argus-app/backend/worker.py \
            argus-app/backend/models/ \
            argus-app/backend/services/analysis_service.py \
            argus-app/backend/services/benchmark_service.py \
            argus-app/backend/services/drafting_service.py \
            argus-app/backend/services/intake_service.py \
            argus-app/backend/services/investigation_service.py \
            argus-app/backend/services/job_service.py \
            argus-app/backend/services/observation_service.py \
            argus-app/backend/services/review_service.py \
            argus-app/backend/testing/ \
            argus-app/backend/migrations/ \
            argus-app/backend/tests/ \
            argus-app/eval/ \
            argus-app/scripts/
      - name: Verify Alembic migrations & full PostgreSQL contract suite
        env:
          PYTHONHASHSEED: '0'
          PYTHONPATH: ${{ github.workspace }}/argus-app:${{ github.workspace }}
          ARGUS_TEST_DATABASE_URL: postgresql+psycopg://argus_admin:argus_test_password@127.0.0.1:5432/argus_test
          ARGUS_DATABASE_URL: postgresql+psycopg://argus_admin:argus_test_password@127.0.0.1:5432/argus_test
        run: |
          alembic -c argus-app/backend/alembic.ini upgrade head
          pytest argus-app/backend/tests/ -v
      - name: Run isolated backup and restore rehearsal
        env:
          PYTHONPATH: ${{ github.workspace }}/argus-app:${{ github.workspace }}
          ARGUS_TEST_DATABASE_URL: postgresql+psycopg://argus_admin:argus_test_password@127.0.0.1:5432/argus_test
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python argus-app/scripts/rehearse_recovery.py --output recovery_rehearsal.json

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: argus-app/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Run Vitest suite
        run: npm test
      - name: Verify self-hosted production build (zero external font CDN)
        run: |
          npm run build
          ! grep -rn "fonts.googleapis.com" dist/

  build-production-image:
    runs-on: ubuntu-latest
    needs: [test-forge, test-tracer, test-production-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build unified non-root production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: argus-app/Dockerfile
          push: false
          load: true
          tags: argus-production:ci-smoke
      - name: Verify non-root user, fail-closed startup & zero research routes
        run: |
          docker run --rm argus-production:ci-smoke id -u | grep -qx "1000"
          docker run --rm argus-production:ci-smoke python -c "
          from backend.production import create_production_app
          from backend.settings import ProductionSettings
          cfg = ProductionSettings('postgresql+psycopg://u:p@127.0.0.1/db', 'https://argus.example', 'https://idp.example', 'c', 's')
          app = create_production_app(cfg)
          paths = {r.path for r in app.routes}
          assert '/api/health/live' in paths
          assert not any(p.startswith('/api/generate') for p in paths)
          print('Production image smoke passed')
          "

  security-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Python CycloneDX SBOM & audit production deps
        run: |
          pip install pip-audit cyclonedx-bom
          cyclonedx-py requirements argus-app/backend/requirements-prod.txt -o sbom-python-prod.json
          pip-audit -r argus-app/backend/requirements-prod.txt
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-sbom
          path: sbom-python-prod.json
