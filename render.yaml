# Render.com deployment configuration for ARGUS
services:
  - type: web
    name: argus
    runtime: docker
    dockerfilePath: argus-app/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ARGUS_ENV
        value: production
      - key: SEED
        value: "42"
      - key: DIFFICULTY
        value: "5"
      - key: GRAPH_SIZE
        value: "5000"
      - key: PORT
        value: "8000"
      - key: PYTHONPATH
        value: /app
      - key: UNIFIED_MODE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false  # Set manually in Render dashboard (optional — mechanical SAR fallback when absent)
