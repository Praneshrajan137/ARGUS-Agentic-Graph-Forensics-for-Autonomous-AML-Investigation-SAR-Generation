# ARGUS Local Production Stack (PostgreSQL 16 + Local Test OIDC IdP + Migrator + API + Supervised Worker)
# Usage: docker compose -f argus-app/docker-compose.prod.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: argus_migrator
      POSTGRES_PASSWORD: argus_migrator_local_dev
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus_migrator -d argus"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrator:
    image: argus-production:local
    build:
      context: ..
      dockerfile: argus-app/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARGUS_DATABASE_URL: postgresql+psycopg://argus_migrator:argus_migrator_local_dev@postgres:5432/argus
    command:
      - sh
      - -c
      - >
        alembic -c /app/argus-app/backend/alembic.ini upgrade head &&
        psql "postgresql://argus_migrator:argus_migrator_local_dev@postgres:5432/argus" -c
        "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO argus_app, argus_worker;
         GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO argus_app, argus_worker;
         REVOKE UPDATE, DELETE ON ledger_record, source_file, source_occurrence, snapshot_record, import_batch, audit_event, case_contributor, approval, export, case_observation, case_finding_disposition, case_comment FROM argus_app, argus_worker;"
    restart: "no"

  api:
    image: argus-production:local
    build:
      context: ..
      dockerfile: argus-app/Dockerfile
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      ARGUS_DEPLOYMENT: local
      ARGUS_DATABASE_URL: postgresql+psycopg://argus_app:argus_app_local_dev@postgres:5432/argus
      ARGUS_PUBLIC_ORIGIN: http://127.0.0.1:8000
      ARGUS_OIDC_ISSUER: http://127.0.0.1:9000
      ARGUS_OIDC_CLIENT_ID: argus-local-client
      ARGUS_OIDC_CLIENT_SECRET: argus-local-secret
    ports:
      - "8000:8000"
      - "9000:9000"
    mem_limit: 2g
    cpus: 2.0

  local-idp:
    image: argus-production:local
    build:
      context: ..
      dockerfile: argus-app/Dockerfile
    depends_on:
      - api
    network_mode: "service:api"
    command: ["python", "-m", "uvicorn", "backend.testing.local_idp:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      LOCAL_IDP_ISSUER: http://127.0.0.1:9000
      ARGUS_OIDC_CLIENT_ID: argus-local-client
      ARGUS_OIDC_CLIENT_SECRET: argus-local-secret
      LOCAL_IDP_REDIRECT_URI: http://127.0.0.1:8000/api/auth/callback
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/.well-known/openid-configuration >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: argus-production:local
    build:
      context: ..
      dockerfile: argus-app/Dockerfile
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      ARGUS_DEPLOYMENT: local
      ARGUS_DATABASE_URL: postgresql+psycopg://argus_worker:argus_worker_local_dev@postgres:5432/argus
      ARGUS_PUBLIC_ORIGIN: http://127.0.0.1:8000
      ARGUS_OIDC_ISSUER: http://127.0.0.1:9000
      ARGUS_OIDC_CLIENT_ID: argus-local-client
      ARGUS_OIDC_CLIENT_SECRET: argus-local-secret
    command: ["python", "-m", "backend.worker"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; from sqlalchemy import text; from backend.database import create_engine_from_url; e = create_engine_from_url(os.environ['ARGUS_DATABASE_URL']); c = e.connect(); c.execute(text('SELECT 1')); c.close(); e.dispose()\""]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 4g
    cpus: 4.0

volumes:
  pg_data:
