# ARGUS: Agentic Graph Forensics for Autonomous AML Investigation & SAR Generation
# Docker Compose Configuration
#
# Usage:
#   docker-compose up --build              # Build and start all services
#   docker-compose up -d                   # Start in detached mode
#   docker-compose logs -f forge           # View Forge Agent logs
#   docker-compose run tracer              # Run Tracer Agent investigation
#   docker-compose down                    # Stop and remove containers
#
# Reproducibility:
#   SEED=42 DIFFICULTY=5 docker-compose up --build


services:
  # ==========================================================================
  # FORGE AGENT - Data Generator (Server)
  # ==========================================================================
  forge:
    image: praneshrajan15/argus-forge:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argus-forge
    ports:
      - "8000:8000"
    volumes:
      # Mount outputs directory for persistence
      - ./outputs:/mnt/user-data/outputs
    environment:
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - SEED=${SEED:-42}
      - DIFFICULTY=${DIFFICULTY:-5}
    # Generate data and start server in one process (data stays in memory)
    command: >
      python main.py serve
      --host 0.0.0.0
      --port 8000
      --generate-on-startup
      --seed ${SEED:-42}
      --difficulty ${DIFFICULTY:-5}
      --output-dir /mnt/user-data/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - argus-network

  # ==========================================================================
  # TRACER AGENT - Baseline Investigator (Client)
  # ==========================================================================
  tracer:
    build:
      context: ./purple_agent
      dockerfile: Dockerfile
    container_name: argus-tracer
    depends_on:
      forge:
        condition: service_healthy
    environment:
      - FORGE_URL=http://forge:8000
      - PARTICIPANT_ID=${PARTICIPANT_ID:-baseline_tracer_agent}
      - PYTHONUNBUFFERED=1
    networks:
      - argus-network
    # Tracer agent runs once and exits
    restart: "no"

  # ==========================================================================
  # REPRODUCIBILITY RUNNER - Deterministic Verification
  # ==========================================================================
  reproducibility-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reproducibility-runner
    volumes:
      - ./outputs:/mnt/user-data/outputs
      - ./results:/mnt/user-data/results
    environment:
      - SEED=${SEED:-42}
      - DIFFICULTY=${DIFFICULTY:-5}
      - RUNS=${RUNS:-3}
      - PYTHONUNBUFFERED=1
    command: >
      python scripts/run_benchmark.py
      --seed ${SEED:-42}
      --difficulty ${DIFFICULTY:-5}
      --runs ${RUNS:-3}
      --output /mnt/user-data/results/reproducibility_results.json
    networks:
      - argus-network
    profiles:
      - reproducibility
    restart: "no"

networks:
  argus-network:
    driver: bridge
    name: argus-network
