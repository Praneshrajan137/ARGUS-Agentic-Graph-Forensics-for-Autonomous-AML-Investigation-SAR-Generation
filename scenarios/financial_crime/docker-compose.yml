# Financial Crime Investigation Platform - Docker Compose
# ARGUS Section 4.2.2 - Sidecar Pattern
#
# Architecture:
#   forge_agent_app (Python FastAPI on 0.0.0.0:5000) - INTERNAL ONLY
#   forge_agent_envoy (Envoy proxy on 0.0.0.0:8000) - EXTERNAL
#   ratelimit_service (Redis-backed rate limiter)
#   redis (Backend for rate limit service)
#   tracer_agent (Baseline investigator)
#
# CRITICAL: forge_agent_app binds to 0.0.0.0:5000 but is NOT exposed externally
#           Envoy proxies external :8000 -> internal forge_agent_app:5000
#
# Usage:
#   cd scenarios/financial_crime
#   docker-compose up --build              # Build and start all services
#   docker-compose up -d                   # Start in detached mode
#   docker-compose run tracer_agent        # Run Tracer Agent investigation
#
# Environment Variables:
#   SEED: Random seed (default: 42)
#   DIFFICULTY: Crime difficulty 1-10 (default: 5)

version: '3.8'

services:
  # ====================================================================
  # Forge Agent: Python Application (INTERNAL ONLY - via Envoy)
  # ====================================================================
  forge_agent_app:
    build:
      context: ../..
      dockerfile: scenarios/financial_crime/forge_agent/Dockerfile
    container_name: forge-app
    # CRITICAL: Only expose to Docker network, NOT to host
    expose:
      - "5000"
    networks:
      - agent_network
    environment:
      - SEED=${SEED:-42}
      - DIFFICULTY=${DIFFICULTY:-5}
      - GENERATE_EVIDENCE=true
      - PYTHONUNBUFFERED=1
      - PORT=5000
    volumes:
      - ./forge_agent/outputs:/app/outputs
      - ./forge_agent/data:/app/data
    healthcheck:
      # Use curl (installed in Dockerfile) for reliable health checks
      test: [ "CMD", "curl", "-sf", "http://localhost:5000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    # CRITICAL: Bind to 0.0.0.0 for container networking (NOT 127.0.0.1)
    command: >
      python main.py serve --host 0.0.0.0 --port 5000 --generate-on-startup --seed ${SEED:-42} --difficulty ${DIFFICULTY:-5} --output-dir /app/outputs

  # ====================================================================
  # ENVOY SIDECAR: Production Networking Layer (EXTERNAL)
  # ====================================================================
  forge_agent_envoy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: forge-envoy
    ports:
      - "8000:8000" # External traffic
      - "9901:9901" # Admin interface
    networks:
      - agent_network
    volumes:
      - ./forge_agent/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      forge_agent_app:
        condition: service_healthy
    command: [ "/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml", "--service-cluster", "forge" ]
    # NOTE: Envoy distroless image lacks wget/curl for health checks
    # We rely on depends_on service_healthy for forge_agent_app instead
    restart: unless-stopped

  # ====================================================================
  # REDIS: Backend for rate limit service
  # ====================================================================
  redis:
    image: redis:7-alpine
    container_name: forge-redis
    networks:
      - agent_network
    expose:
      - "6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ====================================================================
  # Tracer Agent: Baseline Investigator
  # ====================================================================
  tracer_agent:
    build:
      context: ../../tracer_agent
      dockerfile: Dockerfile
    container_name: tracer-baseline
    networks:
      - agent_network
    depends_on:
      forge_agent_app:
        condition: service_healthy
      forge_agent_envoy:
        condition: service_started
    environment:
      - forge_agent_URL=http://forge_agent_envoy:8000
      - PARTICIPANT_ID=${PARTICIPANT_ID:-baseline_tracer_agent}
      - PYTHONUNBUFFERED=1
    command: [ "--forge-url", "http://forge_agent_envoy:8000", "--participant-id", "${PARTICIPANT_ID:-baseline_tracer_agent}", "--nodes", "0", "42", "100", "250" ]
    restart: "no"

networks:
  agent_network:
    driver: bridge
    # Use unique network name to avoid conflicts with root docker-compose
    name: argus-sidecar-network

volumes:
  redis_data:
