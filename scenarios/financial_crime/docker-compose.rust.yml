# Alternative docker-compose.yml using Rust sidecar instead of Envoy
# ARGUS - High Performance Variant
#
# Use this for maximum performance (lower latency, smaller footprint)
# Envoy version is preferred for production due to ecosystem support

version: '3.8'

services:
  # ====================================================================
  # Forge Agent: Python Application (INTERNAL)
  # ====================================================================
  forge_agent_app:
    build:
      context: ../..
      dockerfile: scenarios/financial_crime/forge_agent/Dockerfile
    container_name: forge-app
    expose:
      - "5000"
    networks:
      - agent_network
    environment:
      - SEED=${SEED:-42}
      - DIFFICULTY=${DIFFICULTY:-5}
      - GENERATE_EVIDENCE=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ./forge_agent/outputs:/app/outputs
      - ./forge_agent/data:/app/data
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:5000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      python main.py serve --host 127.0.0.1 --port 5000 --generate-on-startup --seed ${SEED:-42} --difficulty ${DIFFICULTY:-5} --output-dir /app/outputs

  # ====================================================================
  # RUST SIDECAR: High-Performance Proxy (EXTERNAL)
  # ====================================================================
  forge_agent_sidecar:
    build:
      context: ./forge_agent/sidecar
      dockerfile: Dockerfile
    container_name: forge-sidecar
    ports:
      - "8000:8000"
    networks:
      - agent_network
    depends_on:
      forge_agent_app:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - BACKEND_URL=http://forge_agent_app:5000

  # ====================================================================
  # Tracer Agent: Baseline Investigator
  # ====================================================================
  tracer_agent:
    build:
      context: ../../tracer_agent
      dockerfile: Dockerfile
    container_name: tracer-baseline
    networks:
      - agent_network
    depends_on:
      - forge_agent_sidecar
    environment:
      - forge_agent_URL=http://forge_agent_sidecar:8000
      - PARTICIPANT_ID=${PARTICIPANT_ID:-baseline_tracer_agent}
      - PYTHONUNBUFFERED=1
    command: [ "--forge-url", "http://forge_agent_sidecar:8000", "--participant-id", "${PARTICIPANT_ID:-baseline_tracer_agent}", "--nodes", "0", "42", "100" ]
    restart: "no"

networks:
  agent_network:
    driver: bridge
    name: argus-network-rust
